<!-- Zentrales Marmotte-Design-System.
     Reihenfolge zwingend: tokens -> components -> lokale style.css.
     Kein Cache-Buster noetig: der Service Worker holt diese beiden Dateien
     network-first, Aenderungen im Design-Repo kommen sofort an. -->
<link rel="stylesheet" href="https://bakerymarmotte-cmyk.github.io/marmotte-design/tokens.css">
<link rel="stylesheet" href="https://bakerymarmotte-cmyk.github.io/marmotte-design/components.css">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  /* ---------- Sticky Kopfbereich (Topbar + Tabbar) ----------
     Die .topbar-Optik kommt aus marmotte-design/components.css.
     Hier nur der Rahmen, der sie (samt Tabbar) oben kleben laesst:
     Hintergrund, damit Inhalt nicht durchscheint, plus Safe-Area fuers iPhone.
     ---------------------------------------------------------- */
  .app-topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--color-bg);
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--color-border);
  }

  /* ---------- Main content ---------- */
  main {
    flex: 1;
    padding: 20px 16px 32px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view-title {
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 16px;
  }
  .placeholder-card {
    padding: 28px 22px;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 14px;
  }
  .placeholder-card .stage-tag {
    display: inline-block;
    background: var(--color-surface-raised);
    color: var(--color-yellow);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  /* Sub-tabs (z.B. innerhalb "Bestellung erstellen") */
  .subtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .subtab-btn {
    flex: none;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .subtab-btn.active {
    background: var(--color-yellow);
    color: #1a1400;
    border-color: var(--color-yellow);
  }

  /* ---------- Tab-Leiste ----------
     Bewusst lokal: components.css regelt nur die Topbar, die Tabs
     unterscheiden sich je App. Optik an die Zeiterfassung angeglichen:
     Icon oben, Label darunter, aktiver Tab gold + goldener Strich unten.
     --------------------------------- */
  .tabbar {
    display: flex;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 6px;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--color-text-muted);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    padding: 8px 4px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    line-height: 1.2;
  }
  .tab-btn .tab-icon {
    font-size: 16px;
    line-height: 1;
  }
  .tab-btn.active {
    color: var(--color-yellow);
    border-bottom-color: var(--color-yellow);
  }

  .loading-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--color-text-muted);
    font-size: 14px;
  }

  /* ---------- Verwaltung (Gruppen/Artikel) ---------- */
  .mgmt-section { margin-bottom: 28px; }
  .mgmt-section h3 {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-text-muted);
    margin: 0 0 12px;
  }
  .inline-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .inline-form input, .inline-form select {
    flex: 1;
    min-width: 140px;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
  }
  .inline-form input:focus, .inline-form select:focus { outline: none; border-color: var(--color-yellow); }
  .inline-form .btn { flex: none; padding: 11px 16px; font-size: 13.5px; }

  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .row-name {
    flex: 1;
    font-size: 14px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .list-row .row-name input {
    width: 100%;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-yellow);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
  }
  .row-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { border-color: var(--color-yellow); color: var(--color-yellow); }
  .icon-btn.danger:hover { border-color: rgba(229, 72, 77, 0.5); color: var(--color-danger); }
  .toggle-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .toggle-btn.active {
    background: rgba(76, 175, 125, 0.15);
    border-color: var(--color-success);
    color: var(--color-success);
  }
  .group-header {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-yellow);
    padding: 12px 14px 6px;
  }
  .group-header:first-child { padding-top: 4px; }

  .menge-input {
    width: 64px;
    text-align: center;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 8px 6px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
    flex: none;
  }
  .menge-input:focus { outline: none; border-color: var(--color-yellow); }

  .static-value {
    padding: 12px 14px;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 15px;
  }

  .type-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--color-surface-raised);
    color: var(--color-text-muted);
  }
  .type-badge.type-abteilung { color: #8ecbff; }
  .type-badge.type-kunde { color: #ffd27a; }
  .type-badge.type-hotel { color: #b7f0c0; }

  .status-tag {
    display: inline-block;
    flex: none;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 14px;
    white-space: nowrap;
  }
  .status-tag.status-offen { background: rgba(253, 214, 0, 0.12); color: var(--color-yellow); }
  .status-tag.status-in_verarbeitung { background: rgba(76, 175, 125, 0.15); color: var(--color-success); }

  /* ---------- Modal (Bestellung bearbeiten) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-panel {
    background: var(--color-bg);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    background: var(--color-bg);
    font-weight: 700;
    font-size: 15px;
    z-index: 1;
  }
  .modal-body { padding: 16px; }
</style>

<div id="loading-screen" class="loading-screen">Wird geladen …</div>

<div id="app-shell" style="display:none;">
  <div class="app-topbar">
    <!-- Struktur exakt wie in marmotte-design/components.css dokumentiert -->
    <div class="topbar">
      <div class="brand">

        <div class="brand-sub">Bestellungen</div>
      </div>

        <button type="button" class="logout-btn" id="logout-btn">Abmelden</button>
      </div>

      <!-- Tabs werden per JS eingefügt, je nach Rolle -->
    </nav>

    <!-- Views werden per JS eingefügt, je nach Rolle -->

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, getDocs, setDoc, collection, addDoc, updateDoc, deleteDoc,
    onSnapshot, serverTimestamp, query, where, deleteField,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---------------------------------------------------------------------
  // Tab-Konfiguration je Rolle.
  // Jeder Tab hat eine id (= View-id) und ein Label.
  // "erstellen" (admin/leitung) hat zusätzlich Sub-Tabs zur Typ-Auswahl.
  // ---------------------------------------------------------------------
  const TABS_BY_ROLE = {
    admin: [
      { id: "bestellungen", label: "Alle Bestellungen", icon: "📋" },
      { id: "erstellen", label: "Bestellung erstellen", icon: "➕" },
      { id: "einstellungen", label: "Einstellungen", icon: "⚙️" },
    ],
    leitung: [
      { id: "bestellungen", label: "Alle Bestellungen", icon: "📋" },
      { id: "erstellen", label: "Bestellung erstellen", icon: "➕" },
      { id: "einstellungen", label: "Einstellungen", icon: "⚙️" },
    ],
    abteilung: [
      { id: "bestellungen", label: "Meine Bestellungen", icon: "📋" },
      { id: "neu-abteilung", label: "Abteilung", icon: "🏠" },
      { id: "neu-kunde", label: "Kunde", icon: "👤" },
      { id: "neu-hotel", label: "Hotel/Rest.", icon: "🏨" },
    ],
    hotelrestaurant: [
      { id: "bestellungen", label: "Meine Bestellungen", icon: "📋" },
      { id: "neu", label: "Neue Bestellung", icon: "➕" },
    ],
  };

  const ROLE_LABELS = {
    admin: "Admin",
    leitung: "Leitung",
    abteilung: "Abteilung",
    hotelrestaurant: "Hotel / Restaurant",
  };

  // Placeholder-Inhalt je View-id. Wird in späteren Schichten durch
  // echte Formulare/Listen ersetzt.
  const VIEW_PLACEHOLDERS = {
    "bestellungen": "Übersicht aller Bestellungen – wird in Schicht 2 gebaut.",
    "erstellen": null, // hat Sub-Tabs, siehe renderErstellenView
    "einstellungen": null, // hat Sub-Tabs, siehe renderEinstellungenView
    "neu-abteilung": "Formular Abteilungsbestellung – wird in Schicht 2 gebaut.",
    "neu-kunde": "Formular Kundenbestellung – wird in Schicht 2 gebaut.",
    "neu-hotel": "Formular Hotel/Restaurant-Bestellung – wird in Schicht 2 gebaut.",
    "neu": "Formular Neue Bestellung – wird in Schicht 2 gebaut.",
  };

  const ERSTELLEN_SUBTABS = [
    { id: "abteilung", label: "Abteilungsbestellung" },
    { id: "kunde", label: "Kundenbestellung" },
    { id: "hotel", label: "Hotel/Restaurant" },
  ];

  const EINSTELLUNGEN_SUBTABS = [
    { id: "artikel-abteilung", label: "Artikel Abteilung/Kunde" },
    { id: "artikel-hotel", label: "Artikel Hotel/Restaurant" },
    { id: "bestellschluss", label: "Bestellschluss-Zeiten" },
  ];

  function placeholderCard(text) {
    return `
      <div class="card placeholder-card">
        <span class="stage-tag">Schicht 1 – Shell</span>
        <p>${text}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function nextSortValue(list) {
    if (!list.length) return 0;
    return Math.max(...list.map((item) => item.sortierung || 0)) + 1;
  }

  // -----------------------------------------------------------------
  // Zeit-Konvertierung Schweizer Lokalzeit <-> UTC-Minuten seit Mitternacht.
  // Bestellschluss-Zeiten werden als UTC-Minuten gespeichert (Security Rules
  // kennen nur UTC-Serverzeit). Die Umrechnung erfolgt anhand des heutigen
  // Datums, damit die Sommer-/Winterzeit korrekt berücksichtigt wird.
  // Randfall: an den 2 Zeitumstellungstagen im Jahr kann es zu einer
  // 1h-Verschiebung kommen, falls die Einstellung nicht am selben Tag neu
  // gespeichert wird.
  // -----------------------------------------------------------------
  function utcMinutesToZurichTimeString(minutes) {
    const now = new Date();
    const utcDate = new Date(Date.UTC(
      now.getFullYear(), now.getMonth(), now.getDate(),
      Math.floor(minutes / 60), minutes % 60
    ));
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Zurich", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).format(utcDate);
  }

  function zurichLocalToUtcMinutes(hh, mm) {
    const now = new Date();
    const guessUtc = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm));
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Zurich",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(guessUtc).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
    const zurichWallAsUtcMillis = Date.UTC(
      Number(parts.year), Number(parts.month) - 1, Number(parts.day),
      Number(parts.hour), Number(parts.minute)
    );
    const offsetMinutes = Math.round((zurichWallAsUtcMillis - guessUtc.getTime()) / 60000);
    const actualUtc = new Date(guessUtc.getTime() - offsetMinutes * 60000);
    return actualUtc.getUTCHours() * 60 + actualUtc.getUTCMinutes();
  }

  // -----------------------------------------------------------------
  // Einstellungen > Bestellschluss-Zeiten
  // Ein Dokument einstellungen/bestellschluss mit Feldern
  // abteilung / kunde / hotel (jeweils UTC-Minuten seit Mitternacht).
  // -----------------------------------------------------------------
  async function initBestellschlussPanel(panel) {
    panel.innerHTML = `
      <div class="mgmt-section">
        <h3>Bestellschluss-Zeiten</h3>
        <p class="hint-text" style="margin:-4px 0 18px;">
          Schweizer Lokalzeit, gilt täglich gleich, bis hier geändert. Nach Bestellschluss
          bleiben Bestellungen sichtbar, sind aber nicht mehr bearbeitbar.
        </p>
        <form id="bestellschluss-form">
          <div class="field">
            <label for="bs-abteilung">Abteilung</label>
            <input type="time" id="bs-abteilung" required>
          </div>
          <div class="field">
            <label for="bs-kunde">Kunde</label>
            <input type="time" id="bs-kunde" required>
          </div>
          <div class="field">
            <label for="bs-hotel">Hotel/Restaurant</label>
            <input type="time" id="bs-hotel" required>
          </div>
          <div class="error-text" id="bs-error"></div>
          <div id="bs-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="bs-save-btn" style="width:100%;">Speichern</button>
        </form>
      </div>
    `;

    const form = panel.querySelector("#bestellschluss-form");
    const errorEl = panel.querySelector("#bs-error");
    const successEl = panel.querySelector("#bs-success");
    const saveBtn = panel.querySelector("#bs-save-btn");
    const TYPES = ["abteilung", "kunde", "hotel"];

    try {
      const snap = await getDoc(doc(db, "einstellungen", "bestellschluss"));
      if (snap.exists()) {
        const data = snap.data();
        TYPES.forEach((typ) => {
          if (typeof data[typ] === "number") {
            panel.querySelector(`#bs-${typ}`).value = utcMinutesToZurichTimeString(data[typ]);
          }
        });
      }
    } catch (err) {
      console.error(err);
      errorEl.textContent = "Bestehende Zeiten konnten nicht geladen werden.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";
      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        const payload = {};
        TYPES.forEach((typ) => {
          const value = panel.querySelector(`#bs-${typ}`).value;
          const [hh, mm] = value.split(":").map(Number);
          payload[typ] = zurichLocalToUtcMinutes(hh, mm);
        });
        await setDoc(doc(db, "einstellungen", "bestellschluss"), payload, { merge: true });
        successEl.textContent = "Gespeichert.";
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Speichern";
      }
    });
  }

  // -----------------------------------------------------------------
  // Einstellungen > Artikel Abteilung/Kunde
  // Verwaltet zwei Collections: artikel_gruppen (name, sortierung)
  // und artikel_abteilung (name, aktiv, gruppe, sortierung).
  // -----------------------------------------------------------------
  function initArtikelAbteilungPanel(panel) {
    panel.innerHTML = `
      <div class="mgmt-section">
        <h3>Gruppen</h3>
        <form class="inline-form" id="gruppe-form">
          <input type="text" id="gruppe-name-input" placeholder="Neue Gruppe…" required>
          <button type="submit" class="btn btn-secondary">Hinzufügen</button>
        </form>
        <div class="card" id="gruppen-list"></div>
      </div>
      <div class="mgmt-section">
        <h3>Artikel</h3>
        <form class="inline-form" id="artikel-form">
          <input type="text" id="artikel-name-input" placeholder="Artikelname…" required>
          <select id="artikel-gruppe-select" required></select>
          <button type="submit" class="btn btn-secondary">Hinzufügen</button>
        </form>
        <div class="card" id="artikel-list"></div>
      </div>
    `;

    let gruppen = [];
    let artikel = [];

    const gruppenListEl = panel.querySelector("#gruppen-list");
    const artikelListEl = panel.querySelector("#artikel-list");
    const gruppeSelect = panel.querySelector("#artikel-gruppe-select");

    function renderGruppen() {
      if (!gruppen.length) {
        gruppenListEl.innerHTML = `<div class="list-row"><span class="hint-text">Noch keine Gruppen angelegt.</span></div>`;
      } else {
        gruppenListEl.innerHTML = gruppen
          .map(
            (g) => `
          <div class="list-row" data-id="${g.id}">
            <span class="row-name" data-role="display">${escapeHtml(g.name)}</span>
            <div class="row-actions">
              <button type="button" class="icon-btn" data-action="edit" title="Umbenennen">✎</button>
              <button type="button" class="icon-btn danger" data-action="delete" title="Löschen">🗑</button>
            </div>
          </div>`
          )
          .join("");
      }
      gruppeSelect.innerHTML = gruppen
        .map((g) => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`)
        .join("");
    }

    function renderArtikel() {
      if (!artikel.length) {
        artikelListEl.innerHTML = `<div class="list-row"><span class="hint-text">Noch keine Artikel angelegt.</span></div>`;
        return;
      }
      const byGroup = {};
      artikel.forEach((a) => {
        const g = a.gruppe || "Ohne Gruppe";
        (byGroup[g] = byGroup[g] || []).push(a);
      });
      const knownOrder = gruppen.map((g) => g.name);
      const extraGroups = Object.keys(byGroup).filter((g) => !knownOrder.includes(g));
      const groupOrder = [...knownOrder, ...extraGroups].filter((g) => byGroup[g]);

      artikelListEl.innerHTML = groupOrder
        .map((g) => {
          const rows = byGroup[g]
            .slice()
            .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0))
            .map(
              (a) => `
            <div class="list-row" data-id="${a.id}">
              <span class="row-name" data-role="display">${escapeHtml(a.name)}</span>
              <div class="row-actions">
                <button type="button" class="toggle-btn ${a.aktiv ? "active" : ""}" data-action="toggle">${a.aktiv ? "Aktiv" : "Inaktiv"}</button>
                <button type="button" class="icon-btn" data-action="edit" title="Umbenennen">✎</button>
                <button type="button" class="icon-btn danger" data-action="delete" title="Löschen">🗑</button>
              </div>
            </div>`
            )
            .join("");
          return `<div class="group-header">${escapeHtml(g)}</div>${rows}`;
        })
        .join("");
    }

    onSnapshot(collection(db, "artikel_gruppen"), (snap) => {
      gruppen = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0));
      renderGruppen();
      renderArtikel();
    });

    onSnapshot(collection(db, "artikel_abteilung"), (snap) => {
      artikel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderArtikel();
    });

    panel.querySelector("#gruppe-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = panel.querySelector("#gruppe-name-input");
      const name = input.value.trim();
      if (!name) return;
      await addDoc(collection(db, "artikel_gruppen"), {
        name,
        sortierung: nextSortValue(gruppen),
      });
      input.value = "";
    });

    panel.querySelector("#artikel-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameInput = panel.querySelector("#artikel-name-input");
      const name = nameInput.value.trim();
      const gruppe = gruppeSelect.value;
      if (!name || !gruppe) return;
      const sortierung = nextSortValue(artikel.filter((a) => a.gruppe === gruppe));
      await addDoc(collection(db, "artikel_abteilung"), {
        name,
        aktiv: true,
        gruppe,
        sortierung,
      });
      nameInput.value = "";
    });

    gruppenListEl.addEventListener("click", (e) => handleRowAction(e, "artikel_gruppen", gruppen));
    artikelListEl.addEventListener("click", (e) => handleRowAction(e, "artikel_abteilung", artikel));

    async function handleRowAction(e, collectionName, sourceList) {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const row = e.target.closest(".list-row");
      const id = row?.dataset.id;
      if (!id) return;
      const action = actionBtn.dataset.action;
      const item = sourceList.find((i) => i.id === id);

      if (action === "delete") {
        const label = collectionName === "artikel_gruppen" ? "diese Gruppe" : "diesen Artikel";
        if (!confirm(`Soll ${label} wirklich gelöscht werden?`)) return;
        await deleteDoc(doc(db, collectionName, id));
      } else if (action === "toggle") {
        await updateDoc(doc(db, collectionName, id), { aktiv: !item.aktiv });
      } else if (action === "edit") {
        const nameEl = row.querySelector('[data-role="display"]');
        const currentName = item ? item.name : nameEl.textContent;
        nameEl.innerHTML = `<input type="text" value="${escapeHtml(currentName)}">`;
        const editInput = nameEl.querySelector("input");
        editInput.focus();
        editInput.select();

        const commit = async () => {
          const newName = editInput.value.trim();
          if (newName && newName !== currentName) {
            await updateDoc(doc(db, collectionName, id), { name: newName });
          } else {
            nameEl.textContent = currentName;
          }
        };
        editInput.addEventListener("blur", commit);
        editInput.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") editInput.blur();
          if (ev.key === "Escape") { nameEl.textContent = currentName; }
        });
      }
    }
  }

  // -----------------------------------------------------------------
  // Wiederverwendbare Artikel-Auswahl (Abteilung + Kunde teilen sich die
  // gleiche Artikelliste artikel_abteilung, gruppiert nach artikel_gruppen).
  // -----------------------------------------------------------------
  async function loadArtikelAbteilungGrouped() {
    const [artikelSnap, gruppenSnap] = await Promise.all([
      getDocs(collection(db, "artikel_abteilung")),
      getDocs(collection(db, "artikel_gruppen")),
    ]);
    const artikelListRaw = artikelSnap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => a.aktiv);
    const gruppen = gruppenSnap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0));
    return { artikelListRaw, gruppen };
  }

  function renderArtikelAuswahlHtml(artikelListRaw, gruppen) {
    if (artikelListRaw.length === 0) {
      return `<p class="hint-text">Keine aktiven Artikel vorhanden. Bitte zuerst in den Einstellungen Artikel anlegen.</p>`;
    }
    const byGroup = {};
    artikelListRaw.forEach((a) => {
      const g = a.gruppe || "Ohne Gruppe";
      (byGroup[g] = byGroup[g] || []).push(a);
    });
    const knownOrder = gruppen.map((g) => g.name);
    const extraGroups = Object.keys(byGroup).filter((g) => !knownOrder.includes(g));
    const groupOrder = [...knownOrder, ...extraGroups].filter((g) => byGroup[g]);

    return groupOrder
      .map((g) => {
        const rows = byGroup[g]
          .slice()
          .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0))
          .map(
            (a) => `
          <div class="list-row">
            <span class="row-name">${escapeHtml(a.name)}</span>
            <input type="number" min="0" step="1" placeholder="0" class="menge-input"
                   data-artikel-id="${a.id}" data-artikel-name="${escapeHtml(a.name)}">
          </div>`
          )
          .join("");
        return `<div class="group-header">${escapeHtml(g)}</div>${rows}`;
      })
      .join("");
  }

  function collectMengeItems(container) {
    const items = [];
    container.querySelectorAll(".menge-input").forEach((inp) => {
      const menge = parseInt(inp.value, 10);
      if (menge > 0) {
        items.push({ artikelId: inp.dataset.artikelId, artikelName: inp.dataset.artikelName, menge });
      }
    });
    return items;
  }

  function todayDateString() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  async function isBestellschlussErreicht(typ) {
    try {
      const bsSnap = await getDoc(doc(db, "einstellungen", "bestellschluss"));
      if (bsSnap.exists() && typeof bsSnap.data()[typ] === "number") {
        const now = new Date();
        const nowUtcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
        return nowUtcMinutes >= bsSnap.data()[typ];
      }
    } catch (err) {
      console.error(err);
    }
    return false;
  }

  // -----------------------------------------------------------------
  // Datums-Helfer: Abteilungsbestellungen sind immer "heute auf morgen".
  // -----------------------------------------------------------------
  function tomorrowDateString() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDateDe(isoDateStr) {
    const [y, m, d] = isoDateStr.split("-");
    return `${d}.${m}.${y}`;
  }

  // -----------------------------------------------------------------
  // Abteilungsbestellung erstellen.
  // Wird sowohl von Rolle 'abteilung' (eigene Abteilung fix) als auch von
  // admin/leitung (Abteilung per Dropdown wählbar) verwendet.
  // -----------------------------------------------------------------
  async function initAbteilungsbestellungForm(container, { role, uid, existing = null, onSaved = null }) {
    container.innerHTML = `<div class="card placeholder-card"><p>Formular wird geladen …</p></div>`;

    const isEdit = !!existing;
    const bestellschlussErreicht = (role !== "admin" && role !== "leitung") && await isBestellschlussErreicht("abteilung");

    let ownAbteilung = null;
    if (role === "abteilung") {
      try {
        const userSnap = await getDoc(doc(db, "users", uid));
        ownAbteilung = userSnap.exists() ? userSnap.data().abteilung : null;
      } catch (err) {
        console.error(err);
      }
    }

    const { artikelListRaw, gruppen } = await loadArtikelAbteilungGrouped();
    const artikelHtml = renderArtikelAuswahlHtml(artikelListRaw, gruppen);
    const liefertagAnzeige = isEdit ? existing.liefertag : tomorrowDateString();
    const abteilungWert = isEdit ? existing.abteilung : ownAbteilung;

    container.innerHTML = `
      <div class="card" style="padding:20px;">
        ${bestellschlussErreicht ? `<div class="error-text" style="margin-bottom:14px;">Bestellschluss für heute erreicht – es kann aktuell keine Abteilungsbestellung mehr ${isEdit ? "geändert" : "erstellt"} werden.</div>` : ""}
        <form id="af-form">
          <div class="field">
            <label>Lieferung</label>
            <div class="static-value">${isEdit ? "" : "Morgen, "}${formatDateDe(liefertagAnzeige)}</div>
          </div>
          ${
            role === "abteilung"
              ? `<div class="field">
                  <label>Abteilung</label>
                  <div class="static-value">${abteilungWert === "dorfladen" ? "Dorfladen" : "Tearoom & Laden"}</div>
                </div>`
              : `<div class="field">
                  <label for="af-abteilung-select">Abteilung</label>
                  <select id="af-abteilung-select" required>
                    <option value="tearoom_laden" ${abteilungWert === "tearoom_laden" ? "selected" : ""}>Tearoom &amp; Laden</option>
                    <option value="dorfladen" ${abteilungWert === "dorfladen" ? "selected" : ""}>Dorfladen</option>
                  </select>
                </div>`
          }
          <div class="field">
            <label>Artikel</label>
            <div class="card" id="af-artikel-liste">${artikelHtml}</div>
          </div>
          <div class="error-text" id="af-error"></div>
          <div id="af-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="af-save-btn" style="width:100%;" ${bestellschlussErreicht ? "disabled" : ""}>
            ${isEdit ? "Änderungen speichern" : "Bestellung speichern"}
          </button>
        </form>
      </div>
    `;

    if (isEdit && existing.items) {
      existing.items.forEach((it) => {
        const inp = container.querySelector(`.menge-input[data-artikel-id="${it.artikelId}"]`);
        if (inp) inp.value = it.menge;
      });
    }

    const form = container.querySelector("#af-form");
    const errorEl = container.querySelector("#af-error");
    const successEl = container.querySelector("#af-success");
    const saveBtn = container.querySelector("#af-save-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";

      const abteilungValue = role === "abteilung"
        ? ownAbteilung
        : container.querySelector("#af-abteilung-select").value;

      if (!abteilungValue) {
        errorEl.textContent = "Abteilung konnte nicht ermittelt werden.";
        return;
      }

      const items = collectMengeItems(container);
      if (items.length === 0) {
        errorEl.textContent = "Bitte mindestens einen Artikel mit Menge grösser 0 angeben.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        if (isEdit) {
          await updateDoc(doc(db, "bestellungen_abteilung", existing.id), {
            abteilung: abteilungValue,
            items,
          });
          successEl.textContent = "Änderungen gespeichert.";
          if (onSaved) setTimeout(onSaved, 600);
        } else {
          await addDoc(collection(db, "bestellungen_abteilung"), {
            abteilung: abteilungValue,
            liefertag: tomorrowDateString(),
            items,
            status: "offen",
            erstelltVon: uid,
            erstelltAm: serverTimestamp(),
          });
          successEl.textContent = "Bestellung gespeichert.";
          container.querySelectorAll(".menge-input").forEach((inp) => { inp.value = ""; });
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = isEdit ? "Änderungen speichern" : "Bestellung speichern";
      }
    });
  }

  // -----------------------------------------------------------------
  // Kundenbestellung erstellen.
  // Wird von Rolle 'abteilung' (Kunde ruft an/mailt/steht im Laden) und von
  // admin/leitung erfasst. Teilt sich die Artikelliste mit der Abteilung.

    const isEdit = !!existing;
    const bestellschlussErreicht = (role !== "admin" && role !== "leitung") && await isBestellschlussErreicht("kunde");
    const { artikelListRaw, gruppen } = await loadArtikelAbteilungGrouped();
    const artikelHtml = renderArtikelAuswahlHtml(artikelListRaw, gruppen);
    const todayStr = todayDateString();
    const liefertagWert = isEdit ? existing.liefertag : todayStr;

    container.innerHTML = `
      <div class="card" style="padding:20px;">
        ${bestellschlussErreicht ? `<div class="error-text" style="margin-bottom:14px;">Bestellschluss für heute erreicht – es können aktuell keine Kundenbestellungen mehr ${isEdit ? "geändert" : "erstellt"} werden.</div>` : ""}
        <form id="kf-form">
          <div class="field">
            <label for="kf-kundenname">Kundenname</label>
            <input type="text" id="kf-kundenname" value="${isEdit ? escapeHtml(existing.kundenName || "") : ""}" required>
          </div>
          <div class="field">
            <label for="kf-liefertag">Liefertag</label>
            <input type="date" id="kf-liefertag" min="${todayStr}" value="${liefertagWert}" required>
          </div>
          <div class="field">
            <label for="kf-liefermethode">Liefermethode</label>
            <select id="kf-liefermethode">
              <option value="abholung" ${isEdit && existing.liefermethode !== "lieferung" ? "selected" : ""}>Abholung</option>
              <option value="lieferung" ${isEdit && existing.liefermethode === "lieferung" ? "selected" : ""}>Lieferung</option>
            </select>
          </div>
          <div id="kf-lieferfelder" style="display:${isEdit && existing.liefermethode === "lieferung" ? "block" : "none"};">
            <div class="field">
              <label for="kf-adresse">Rechnungsadresse</label>
              <textarea id="kf-adresse" rows="3" style="width:100%;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--color-text);font-size:15px;font-family:var(--font-body);resize:vertical;">${isEdit ? escapeHtml(existing.rechnungsadresse || "") : ""}</textarea>
            </div>
            <div class="field">
              <label for="kf-telefon">Telefon</label>
              <input type="tel" id="kf-telefon" value="${isEdit ? escapeHtml(existing.telefon || "") : ""}">
            </div>
            <div class="field">
              <label for="kf-email">E-Mail</label>
              <input type="email" id="kf-email" value="${isEdit ? escapeHtml(existing.email || "") : ""}">
            </div>
          </div>
          <div class="field">
            <label>Artikel</label>
            <div class="card" id="kf-artikel-liste">${artikelHtml}</div>
          </div>
          <div class="error-text" id="kf-error"></div>
          <div id="kf-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="kf-save-btn" style="width:100%;" ${bestellschlussErreicht ? "disabled" : ""}>
            ${isEdit ? "Änderungen speichern" : "Bestellung speichern"}
          </button>
        </form>
      </div>
    `;

    if (isEdit && existing.items) {
      existing.items.forEach((it) => {
        const inp = container.querySelector(`.menge-input[data-artikel-id="${it.artikelId}"]`);
        if (inp) inp.value = it.menge;
      });
    }

    const form = container.querySelector("#kf-form");
    const methodeSelect = container.querySelector("#kf-liefermethode");
    const lieferfelder = container.querySelector("#kf-lieferfelder");
    const errorEl = container.querySelector("#kf-error");
    const successEl = container.querySelector("#kf-success");
    const saveBtn = container.querySelector("#kf-save-btn");

    methodeSelect.addEventListener("change", () => {
      lieferfelder.style.display = methodeSelect.value === "lieferung" ? "block" : "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";

      const kundenName = container.querySelector("#kf-kundenname").value.trim();
      const liefertag = container.querySelector("#kf-liefertag").value;
      const liefermethode = methodeSelect.value;

      if (!kundenName) {
        errorEl.textContent = "Bitte einen Kundennamen angeben.";
        return;
      }
      if (!liefertag) {
        errorEl.textContent = "Bitte einen Liefertag angeben.";
        return;
      }

      let rechnungsadresse = "", telefon = "", email = "";
      if (liefermethode === "lieferung") {
        rechnungsadresse = container.querySelector("#kf-adresse").value.trim();
        telefon = container.querySelector("#kf-telefon").value.trim();
        email = container.querySelector("#kf-email").value.trim();
        if (!rechnungsadresse) {
          errorEl.textContent = "Bitte eine Rechnungsadresse angeben.";
          return;
        }
        if (!telefon && !email) {
          errorEl.textContent = "Bitte Telefon oder E-Mail angeben.";
          return;
        }
      }

      const items = collectMengeItems(container);
      if (items.length === 0) {
        errorEl.textContent = "Bitte mindestens einen Artikel mit Menge grösser 0 angeben.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        if (isEdit) {
          const payload = { kundenName, liefertag, liefermethode, items };
          if (liefermethode === "lieferung") {
            payload.rechnungsadresse = rechnungsadresse;
            payload.telefon = telefon;
            payload.email = email;
          } else {
            payload.rechnungsadresse = deleteField();
            payload.telefon = deleteField();
            payload.email = deleteField();
          }
          await updateDoc(doc(db, "bestellungen_kunde", existing.id), payload);
          successEl.textContent = "Änderungen gespeichert.";
          if (onSaved) setTimeout(onSaved, 600);
        } else {
          const payload = {
            kundenName,
            liefertag,
            liefermethode,
            items,
            status: "offen",
            erstelltVon: uid,
            erstelltAm: serverTimestamp(),
          };
          if (liefermethode === "lieferung") {
            payload.rechnungsadresse = rechnungsadresse;
            payload.telefon = telefon;
            payload.email = email;
          }
          await addDoc(collection(db, "bestellungen_kunde"), payload);
          successEl.textContent = "Bestellung gespeichert.";
          form.reset();
          lieferfelder.style.display = "none";
          container.querySelectorAll(".menge-input").forEach((inp) => { inp.value = ""; });
          container.querySelector("#kf-liefertag").value = todayStr;
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = isEdit ? "Änderungen speichern" : "Bestellung speichern";
      }
    });
  }

  // -----------------------------------------------------------------
  // Hotel/Restaurant-Bestellung erstellen.
  // Wird von Rolle 'hotelrestaurant' (eigenes Hotel fix), 'abteilung' und
  // admin/leitung (Hotel per Dropdown wählbar) verwendet. Eigene,
  // ungruppierte Artikelliste artikel_hotel, alphabetisch sortiert.
  // -----------------------------------------------------------------
  async function initHotelbestellungForm(container, { role, uid, existing = null, onSaved = null }) {
    container.innerHTML = `<div class="card placeholder-card"><p>Formular wird geladen …</p></div>`;

    const isEdit = !!existing;
    const bestellschlussErreicht = (role !== "admin" && role !== "leitung") && await isBestellschlussErreicht("hotel");

    let ownHotelName = null;
    let hotelOptions = [];
    if (role === "hotelrestaurant") {
      try {
        const userSnap = await getDoc(doc(db, "users", uid));
        ownHotelName = userSnap.exists() ? userSnap.data().hotelName : null;
      } catch (err) {
        console.error(err);
      }
    } else {
      try {
        const q = query(collection(db, "users"), where("role", "==", "hotelrestaurant"));
        const snap = await getDocs(q);
        hotelOptions = snap.docs
          .map((d) => ({ uid: d.id, ...d.data() }))
          .filter((u) => u.active !== false)
          .sort((a, b) => (a.hotelName || "").localeCompare(b.hotelName || "", "de"));
      } catch (err) {
        console.error(err);
      }
    }

    let artikelListRaw = [];
    try {
      const snap = await getDocs(collection(db, "artikel_hotel"));
      artikelListRaw = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((a) => a.aktiv)
        .sort((a, b) => a.name.localeCompare(b.name, "de"));
    } catch (err) {
      console.error(err);
    }

    const artikelHtml = artikelListRaw.length === 0
      ? `<p class="hint-text">Keine aktiven Artikel vorhanden. Bitte zuerst in den Einstellungen Artikel anlegen.</p>`
      : artikelListRaw
          .map(
            (a) => `
        <div class="list-row">
          <span class="row-name">${escapeHtml(a.name)}</span>
          <input type="number" min="0" step="1" placeholder="0" class="menge-input"
                 data-artikel-id="${a.id}" data-artikel-name="${escapeHtml(a.name)}">
        </div>`
          )
          .join("");

    const minDate = tomorrowDateString();
    const liefertagWert = isEdit ? existing.liefertag : minDate;

    container.innerHTML = `
      <div class="card" style="padding:20px;">
        ${bestellschlussErreicht ? `<div class="error-text" style="margin-bottom:14px;">Bestellschluss für heute erreicht – es kann aktuell keine Hotel/Restaurant-Bestellung mehr ${isEdit ? "geändert" : "erstellt"} werden.</div>` : ""}
        <form id="hf-form">
          ${
            role === "hotelrestaurant"
              ? `<div class="field">
                  <label>Hotel/Restaurant</label>
                  <div class="static-value">${escapeHtml(ownHotelName || "–")}</div>
                </div>`
              : `<div class="field">
                  <label for="hf-hotel-select">Hotel/Restaurant</label>
                  <select id="hf-hotel-select" required>
                    <option value="" disabled ${!isEdit && hotelOptions.length ? "selected" : ""}>Bitte wählen…</option>
                    ${hotelOptions.map((h) => `<option value="${h.uid}" ${isEdit && existing.hotelUid === h.uid ? "selected" : ""}>${escapeHtml(h.hotelName || h.name || h.uid)}</option>`).join("")}
                  </select>
                  ${hotelOptions.length === 0 ? `<p class="hint-text" style="margin-top:8px;">Keine Hotel/Restaurant-Accounts gefunden.</p>` : ""}
                </div>`
          }
          <div class="field">
            <label for="hf-liefertag">Liefertag</label>
            <input type="date" id="hf-liefertag" min="${minDate}" value="${liefertagWert}" required>
          </div>
          <div class="field">
            <label>Artikel</label>
            <div class="card" id="hf-artikel-liste">${artikelHtml}</div>
          </div>
          <div class="error-text" id="hf-error"></div>
          <div id="hf-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="hf-save-btn" style="width:100%;" ${bestellschlussErreicht ? "disabled" : ""}>
            ${isEdit ? "Änderungen speichern" : "Bestellung speichern"}
          </button>
        </form>
      </div>
    `;

    if (isEdit && existing.items) {
      existing.items.forEach((it) => {
        const inp = container.querySelector(`.menge-input[data-artikel-id="${it.artikelId}"]`);
        if (inp) inp.value = it.menge;
      });
    }

    const form = container.querySelector("#hf-form");
    const errorEl = container.querySelector("#hf-error");
    const successEl = container.querySelector("#hf-success");
    const saveBtn = container.querySelector("#hf-save-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";

      let hotelUid, hotelName;
      if (role === "hotelrestaurant") {
        hotelUid = uid;
        hotelName = ownHotelName;
      } else {
        const select = container.querySelector("#hf-hotel-select");
        hotelUid = select.value;
        const match = hotelOptions.find((h) => h.uid === hotelUid);
        hotelName = match ? match.hotelName : "";
        if (!hotelUid) {
          errorEl.textContent = "Bitte ein Hotel/Restaurant auswählen.";
          return;
        }
      }

      const liefertag = container.querySelector("#hf-liefertag").value;
      if (!liefertag) {
        errorEl.textContent = "Bitte einen Liefertag angeben.";
        return;
      }

      const items = collectMengeItems(container);
      if (items.length === 0) {
        errorEl.textContent = "Bitte mindestens einen Artikel mit Menge grösser 0 angeben.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        if (isEdit) {
          await updateDoc(doc(db, "bestellungen_hotel", existing.id), {
            hotelUid,
            hotelName: hotelName || "",
            liefertag,
            items,
          });
          successEl.textContent = "Änderungen gespeichert.";
          if (onSaved) setTimeout(onSaved, 600);
        } else {
          await addDoc(collection(db, "bestellungen_hotel"), {
            hotelUid,
            hotelName: hotelName || "",
            liefertag,
            items,
            status: "offen",
            erstelltAm: serverTimestamp(),
          });
          successEl.textContent = "Bestellung gespeichert.";
          container.querySelectorAll(".menge-input").forEach((inp) => { inp.value = ""; });
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = isEdit ? "Änderungen speichern" : "Bestellung speichern";
      }
    });
  }

  const TYPE_META = {
    abteilung: { label: "Abteilung", badgeClass: "type-abteilung" },
    kunde: { label: "Kunde", badgeClass: "type-kunde" },
    hotel: { label: "Hotel/Restaurant", badgeClass: "type-hotel" },
  };
  const STATUS_META = {
    offen: { label: "Offen", cls: "status-offen" },
    in_verarbeitung: { label: "In Verarbeitung", cls: "status-in_verarbeitung" },
  };

  // -----------------------------------------------------------------
  // Modal-Overlay für das Bearbeiten einer Bestellung. Öffnet das jeweilige
  // Formular (gleiche Funktion wie beim Erstellen) vorausgefüllt.
  // -----------------------------------------------------------------
  function openEditModal(renderFn) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-panel">
        <div class="modal-header">
          <span>Bestellung bearbeiten</span>
          <button type="button" class="icon-btn" id="modal-close-btn">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector("#modal-close-btn").addEventListener("click", close);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    renderFn(overlay.querySelector("#modal-body"), close);
  }

  // -----------------------------------------------------------------
  // Bestellungen-Übersicht.
  // Kombiniert bestellungen_abteilung / _kunde / _hotel in einer Liste mit
  // Typ-Badge. Sichtbarkeit je Rolle folgt den Firestore Security Rules:
  // admin/leitung sehen alles, abteilung sieht eigene Abteilungs-/Kunden-
  // bestellungen + alle Hotelbestellungen, hotelrestaurant nur eigene.
  // Bearbeiten (alle Felder) über das gleiche Formular wie beim Erstellen,
  // vorausgefüllt in einem Modal. Löschen weiterhin nur admin/leitung.
  // -----------------------------------------------------------------
  // -----------------------------------------------------------------
  // Tagesdruck (PDF, jsPDF). Immer für "morgen":
  // - Abteilungsbestellungen: Tearoom&Laden + Dorfladen zusammen auf 1 A4
  //   (zuerst Tearoom&Laden, dann Dorfladen).
  // - Kundenbestellungen: 1 A4 pro 12 Bestellungen, Raster 3 Spalten x 4
  //   Zeilen, je eine Box pro Bestellung (Name, Liefertag, Artikel).
  // - Hotel/Restaurant: je 1 eigenes A4 pro Bestellung.
  // -----------------------------------------------------------------
  function drawAbteilungsSeite(pdf, orders, liefertag) {
    const pageW = 210, margin = 15;
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(16);
    pdf.text("Abteilungsbestellungen", margin, 20);
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(11);
    pdf.text(`Lieferung: ${formatDateDe(liefertag)}`, margin, 27);

    const reihenfolge = ["tearoom_laden", "dorfladen"];
    const sortiert = reihenfolge.map((t) => orders.find((o) => o.abteilung === t)).filter(Boolean);

    const startY = 36;
    const sectionHeight = (297 - startY - margin) / 2;
    let y = startY;
    sortiert.forEach((o) => {
      const label = o.abteilung === "dorfladen" ? "Dorfladen" : "Tearoom & Laden";
      pdf.setDrawColor(180);
      pdf.rect(margin, y, pageW - margin * 2, sectionHeight - 6);
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(13);
      pdf.text(label, margin + 4, y + 9);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(11);
      let itemY = y + 18;
      (o.items || []).forEach((it) => {
        pdf.text(`${it.artikelName}`, margin + 6, itemY);
        pdf.text(`× ${it.menge}`, pageW - margin - 20, itemY);
        itemY += 6.5;
      });
      if (!o.items || o.items.length === 0) {
        pdf.setTextColor(150);
        pdf.text("Keine Artikel", margin + 6, itemY);
        pdf.setTextColor(0);
      }
      y += sectionHeight;
    });
  }

  function drawKundenSeite(pdf, orders) {
    const pageW = 210, pageH = 297, margin = 10, cols = 3, rows = 4, gap = 4;
    const boxW = (pageW - margin * 2 - gap * (cols - 1)) / cols;
    const boxH = (pageH - margin * 2 - gap * (rows - 1)) / rows;

    orders.forEach((o, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = margin + col * (boxW + gap);
      const y = margin + row * (boxH + gap);

      pdf.setDrawColor(180);
      pdf.rect(x, y, boxW, boxH);

      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(11);
      pdf.text(o.kundenName || "–", x + 3, y + 6, { maxWidth: boxW - 6 });

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(8.5);
      pdf.text(
        `${formatDateDe(o.liefertag)} · ${o.liefermethode === "lieferung" ? "Lieferung" : "Abholung"}`,
        x + 3, y + 12
      );

      pdf.setFontSize(9);
      let itemY = y + 18;
      (o.items || []).forEach((it) => {
        const zeile = `${it.artikelName} × ${it.menge}`;
        const wrapped = pdf.splitTextToSize(zeile, boxW - 6);
        wrapped.forEach((wl) => {
          if (itemY <= y + boxH - 3) {
            pdf.text(wl, x + 3, itemY);
            itemY += 4.2;
          }
        });
      });
    });
  }

  function drawHotelSeite(pdf, o) {
    const pageW = 210, margin = 15;
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(18);
    pdf.text(o.hotelName || "–", margin, 22);
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(12);
    pdf.text(`Lieferung: ${formatDateDe(o.liefertag)}`, margin, 30);
    pdf.setDrawColor(200);
    pdf.line(margin, 35, pageW - margin, 35);

    let y = 46;
    pdf.setFontSize(12);
    (o.items || []).forEach((it) => {
      pdf.text(`${it.artikelName}`, margin, y);
      pdf.text(`× ${it.menge}`, pageW - margin - 22, y);
      y += 8;
    });
    if (!o.items || o.items.length === 0) {
      pdf.setTextColor(150);
      pdf.text("Keine Artikel", margin, y);
      pdf.setTextColor(0);
    }
  }

  function erstelleTagesdruck(abtOrders, kundeOrders, hotelOrders, liefertag) {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert("PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.");
      return;
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4" });
    let pageUsed = false;
    const ensurePage = () => {
      if (pageUsed) pdf.addPage();
      pageUsed = true;
    };

    if (abtOrders.length > 0) {
      ensurePage();
      drawAbteilungsSeite(pdf, abtOrders, liefertag);
    }
    for (let i = 0; i < kundeOrders.length; i += 12) {
      ensurePage();
      drawKundenSeite(pdf, kundeOrders.slice(i, i + 12));
    }
    hotelOrders.forEach((o) => {
      ensurePage();
      drawHotelSeite(pdf, o);
    });

    pdf.save(`Tagesdruck_${liefertag}.pdf`);
  }

  // -----------------------------------------------------------------
  // Monats-Export (CSV) für Hotel/Restaurant-Bestellungen. Eine Zeile pro
  // Artikelposition (Hotel, Liefertag, Artikel, Menge, Bestellung-ID),
  // gedacht zum Weiterverarbeiten (Rechnungsstellung) in einem anderen
  // Programm. Alle Hotels zusammen in einem File, Spalte für Hotelname.
  // -----------------------------------------------------------------
  function csvEscape(val) {
    const str = val == null ? "" : String(val);
    if (/[",\n]/.test(str)) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  }

  function erstelleMonatsExport(hotelOrdersImMonat, monthStr) {
    if (hotelOrdersImMonat.length === 0) {
      alert(`Keine Hotel/Restaurant-Bestellungen für ${monthStr} vorhanden.`);
      return;
    }

    const rows = [["Hotel/Restaurant", "Liefertag", "Artikel", "Menge", "Bestellung-ID"]];
    hotelOrdersImMonat
      .slice()
      .sort((a, b) => (a.liefertag || "").localeCompare(b.liefertag || "") || (a.hotelName || "").localeCompare(b.hotelName || "", "de"))
      .forEach((o) => {
        (o.items || []).forEach((it) => {
          rows.push([o.hotelName || "–", o.liefertag || "", it.artikelName || "", it.menge, o.id]);
        });
        if (!o.items || o.items.length === 0) {
          rows.push([o.hotelName || "–", o.liefertag || "", "(keine Artikel)", 0, o.id]);
        }
      });

    const csvContent = rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Export_HotelRestaurant_${monthStr}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function initBestellungenUebersicht(container, { role, uid }) {
    container.innerHTML = "";
    const listEl = document.createElement("div");

    if (role === "admin" || role === "leitung") {
      const toolbar = document.createElement("div");
      toolbar.style.marginBottom = "14px";
      toolbar.innerHTML = `
        <button type="button" class="btn btn-secondary" id="tagesdruck-btn" style="margin-bottom:10px;">🖨️ Tagesdruck für morgen</button>
        <div class="card" style="padding:14px 16px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div class="field" style="margin:0;flex:1;min-width:140px;">
            <label for="export-monat">Export Hotel/Restaurant</label>
            <input type="month" id="export-monat" value="${todayDateString().slice(0, 7)}">
          </div>
          <button type="button" class="btn btn-secondary" id="export-btn">⬇️ CSV exportieren</button>
        </div>
      `;
      container.appendChild(toolbar);
      toolbar.querySelector("#tagesdruck-btn").addEventListener("click", () => {
        const morgen = tomorrowDateString();
        const abtOrders = dataAbteilung.filter((o) => o.liefertag === morgen);
        const kundeOrders = dataKunde.filter((o) => o.liefertag === morgen);
        const hotelOrders = dataHotel.filter((o) => o.liefertag === morgen);
        if (abtOrders.length === 0 && kundeOrders.length === 0 && hotelOrders.length === 0) {
          alert(`Keine Bestellungen für morgen (${formatDateDe(morgen)}) vorhanden.`);
          return;
        }
        erstelleTagesdruck(abtOrders, kundeOrders, hotelOrders, morgen);
      });
      toolbar.querySelector("#export-btn").addEventListener("click", () => {
        const monthStr = toolbar.querySelector("#export-monat").value;
        if (!monthStr) {
          alert("Bitte einen Monat auswählen.");
          return;
        }
        const imMonat = dataHotel.filter((o) => (o.liefertag || "").startsWith(monthStr));
        erstelleMonatsExport(imMonat, monthStr);
      });
    }

    container.appendChild(listEl);
    listEl.innerHTML = `<div class="card placeholder-card"><p>Bestellungen werden geladen …</p></div>`;

    let dataAbteilung = [];
    let dataKunde = [];
    let dataHotel = [];
    let bestellschlussData = {};
    const loaded = { abteilung: false, kunde: false, hotel: false, bestellschluss: false };

    getDoc(doc(db, "einstellungen", "bestellschluss"))
      .then((snap) => { bestellschlussData = snap.exists() ? snap.data() : {}; })
      .catch((err) => console.error(err))
      .finally(() => { loaded.bestellschluss = true; render(); });

    function bestellschlussErreicht(typ) {
      if (typeof bestellschlussData[typ] !== "number") return false;
      const now = new Date();
      return (now.getUTCHours() * 60 + now.getUTCMinutes()) >= bestellschlussData[typ];
    }

    function canEditOrder(o) {
      if (role === "admin" || role === "leitung") return true;
      if (o.__typ === "abteilung") return role === "abteilung" && o.erstelltVon === uid && !bestellschlussErreicht("abteilung");
      if (o.__typ === "kunde") return role === "abteilung" && o.erstelltVon === uid && !bestellschlussErreicht("kunde");
      if (o.__typ === "hotel") {
        if (role === "abteilung") return !bestellschlussErreicht("hotel");
        if (role === "hotelrestaurant") return o.hotelUid === uid && !bestellschlussErreicht("hotel");
      }
      return false;
    }

    function handleEdit(o) {
      const formByTyp = {
        abteilung: initAbteilungsbestellungForm,
        kunde: initKundenbestellungForm,
        hotel: initHotelbestellungForm,
      };
      const formFn = formByTyp[o.__typ];
      if (!formFn) return;
      openEditModal((body, close) => {
        formFn(body, { role, uid, existing: o, onSaved: close });
      });
    }

    function render() {
      if (!loaded.abteilung || !loaded.kunde || !loaded.hotel || !loaded.bestellschluss) return;

      const morgen = tomorrowDateString();
      const typOrder = { abteilung: 0, kunde: 1, hotel: 2 };

      const all = [
        ...dataAbteilung.map((o) => ({ ...o, __typ: "abteilung", __coll: "bestellungen_abteilung" })),
        ...dataKunde.map((o) => ({ ...o, __typ: "kunde", __coll: "bestellungen_kunde" })),
        ...dataHotel.map((o) => ({ ...o, __typ: "hotel", __coll: "bestellungen_hotel" })),
      ].filter((o) => o.liefertag === morgen);

      const headerHtml = `<p class="hint-text" style="margin:-4px 0 14px;">Liefertag: morgen, ${formatDateDe(morgen)}</p>`;

      if (all.length === 0) {
        listEl.innerHTML = headerHtml + `<div class="card placeholder-card"><p>Keine Bestellungen für morgen vorhanden.</p></div>`;
        return;
      }

      all.sort((a, b) => (typOrder[a.__typ] - typOrder[b.__typ]));

      const canDelete = role === "admin" || role === "leitung";

      listEl.innerHTML = headerHtml + all
        .map((o, idx) => {
          const typMeta = TYPE_META[o.__typ];
          const statusMeta = STATUS_META[o.status] || { label: o.status || "–", cls: "" };
          let titleLine;
          if (o.__typ === "abteilung") {
            titleLine = o.abteilung === "dorfladen" ? "Dorfladen" : "Tearoom & Laden";
          } else if (o.__typ === "kunde") {
            titleLine = `${escapeHtml(o.kundenName || "–")} · ${o.liefermethode === "lieferung" ? "Lieferung" : "Abholung"}`;
          } else {
            titleLine = escapeHtml(o.hotelName || "–");
          }
          const itemsSummary = o.items && o.items.length
            ? o.items.map((it) => `${escapeHtml(it.artikelName)} × ${it.menge}`).join(", ")
            : "Keine Artikel";
          const canEdit = canEditOrder(o);

          return `
            <div class="card" style="padding:14px 16px;margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                <div style="min-width:0;">
                  <span class="type-badge ${typMeta.badgeClass}">${typMeta.label}</span>
                  <div style="font-weight:700;font-size:15px;margin-top:6px;">${titleLine}</div>
                </div>
                <span class="status-tag ${statusMeta.cls}">${statusMeta.label}</span>
              </div>
              <div class="hint-text" style="margin-top:10px;">${itemsSummary}</div>
              <div style="display:flex;gap:8px;margin-top:12px;">
                ${canEdit ? `<button type="button" class="btn btn-secondary" data-action="edit" data-idx="${idx}" style="padding:8px 14px;font-size:13px;">Bearbeiten</button>` : ""}
                ${canDelete ? `<button type="button" class="btn btn-danger" data-action="delete" data-coll="${o.__coll}" data-id="${o.id}" style="padding:8px 14px;font-size:13px;">Löschen</button>` : ""}
              </div>
            </div>
          `;
        })
        .join("");

      listEl.querySelectorAll('[data-action="edit"]').forEach((btn) => {
        btn.addEventListener("click", () => handleEdit(all[Number(btn.dataset.idx)]));
      });
    }

    function watch(collName, filterField, matchesRole, key) {
      const shouldSeeAll = role === "admin" || role === "leitung" || matchesRole === "all";
      if (shouldSeeAll) {
        onSnapshot(collection(db, collName), (snap) => {
          if (key === "abteilung") dataAbteilung = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          if (key === "kunde") dataKunde = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          if (key === "hotel") dataHotel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          loaded[key] = true;
          render();
        });
      } else if (matchesRole === role && filterField) {
        onSnapshot(query(collection(db, collName), where(filterField, "==", uid)), (snap) => {
          if (key === "abteilung") dataAbteilung = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          if (key === "kunde") dataKunde = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          if (key === "hotel") dataHotel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          loaded[key] = true;
          render();
        });
      } else {
        loaded[key] = true;
        render();
      }
    }

    // Abteilungsbestellungen: admin/leitung alles, abteilung nur eigene, hotelrestaurant nichts.
    watch("bestellungen_abteilung", "erstelltVon", "abteilung", "abteilung");
    // Kundenbestellungen: admin/leitung alles, abteilung nur eigene, hotelrestaurant nichts.
    watch("bestellungen_kunde", "erstelltVon", "abteilung", "kunde");
    // Hotelbestellungen: admin/leitung + abteilung sehen alles, hotelrestaurant nur eigene.
    if (role === "hotelrestaurant") {
      onSnapshot(query(collection(db, "bestellungen_hotel"), where("hotelUid", "==", uid)), (snap) => {
        dataHotel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        loaded.hotel = true;
        render();
      });
    } else {
      watch("bestellungen_hotel", null, "all", "hotel");
    }

    listEl.addEventListener("click", async (e) => {
      const btn = e.target.closest('[data-action="delete"]');
      if (!btn) return;
      if (!confirm("Soll diese Bestellung wirklich gelöscht werden?")) return;
      try {
        await deleteDoc(doc(db, btn.dataset.coll, btn.dataset.id));
      } catch (err) {
        console.error(err);
        alert("Fehler beim Löschen. Bitte erneut versuchen.");
      }
    });
  }

  function renderSubtabView(containerId, subtabs, contentPrefix, customRenderers = {}) {
    const container = document.getElementById(containerId);
    const nav = document.createElement("div");
    nav.className = "subtabs";
    subtabs.forEach((st, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "subtab-btn" + (i === 0 ? " active" : "");
      btn.textContent = st.label;
      btn.dataset.subtab = st.id;
      btn.addEventListener("click", () => {
        nav.querySelectorAll(".subtab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        container.querySelectorAll(".subtab-panel").forEach((p) => p.style.display = "none");
        document.getElementById(`${contentPrefix}-${st.id}`).style.display = "block";
      });
      nav.appendChild(btn);
    });
    container.appendChild(nav);

    subtabs.forEach((st, i) => {
      const panel = document.createElement("div");
      panel.className = "subtab-panel";
      panel.id = `${contentPrefix}-${st.id}`;
      panel.style.display = i === 0 ? "block" : "none";
      if (customRenderers[st.id]) {
        customRenderers[st.id](panel);
      } else {
        panel.innerHTML = placeholderCard(`${st.label} – wird in Schicht 2 gebaut.`);
      }
      container.appendChild(panel);
    });
  }

  function buildViews(tabs, role, uid) {
    const main = document.getElementById("main-content");
    main.innerHTML = "";

    tabs.forEach((tab, i) => {
      const view = document.createElement("section");
      view.className = "view" + (i === 0 ? " active" : "");
      view.id = `view-${tab.id}`;

      const title = document.createElement("div");
      title.className = "view-title";
      title.textContent = tab.label;
      view.appendChild(title);

      if (tab.id === "erstellen") {
        main.appendChild(view);
        renderSubtabView(`view-${tab.id}`, ERSTELLEN_SUBTABS, "erstellen", {
          "abteilung": (panel) => initAbteilungsbestellungForm(panel, { role, uid }),
          "kunde": (panel) => initKundenbestellungForm(panel, { role, uid }),
          "hotel": (panel) => initHotelbestellungForm(panel, { role, uid }),
        });
      } else if (tab.id === "einstellungen") {
        main.appendChild(view);
        renderSubtabView(`view-${tab.id}`, EINSTELLUNGEN_SUBTABS, "einstellungen", {
          "artikel-abteilung": initArtikelAbteilungPanel,
          "artikel-hotel": initArtikelHotelPanel,
          "bestellschluss": initBestellschlussPanel,
        });
      } else if (tab.id === "bestellungen") {
        const body = document.createElement("div");
        view.appendChild(body);
        main.appendChild(view);
        initBestellungenUebersicht(body, { role, uid });
      } else if (tab.id === "neu-abteilung") {
        const body = document.createElement("div");
        view.appendChild(body);
        main.appendChild(view);
        initAbteilungsbestellungForm(body, { role, uid });
      } else if (tab.id === "neu-kunde") {
        const body = document.createElement("div");
        view.appendChild(body);
        main.appendChild(view);
        initKundenbestellungForm(body, { role, uid });
      } else if (tab.id === "neu-hotel" || tab.id === "neu") {
        const body = document.createElement("div");
        view.appendChild(body);
        main.appendChild(view);
        initHotelbestellungForm(body, { role, uid });
      } else {
        const body = document.createElement("div");
        body.innerHTML = placeholderCard(VIEW_PLACEHOLDERS[tab.id] || "Kommt in einer späteren Schicht.");
        view.appendChild(body);
        main.appendChild(view);
      }
    });
  }

  function buildTabbar(tabs) {
    const bar = document.getElementById("tabbar");
    bar.innerHTML = "";
    tabs.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (i === 0 ? " active" : "");
      btn.dataset.tab = tab.id;
      btn.innerHTML = `<span class="tab-icon">${tab.icon || ""}</span><span>${tab.label}</span>`;
      btn.addEventListener("click", () => {
        bar.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
        document.getElementById(`view-${tab.id}`).classList.add("active");
        window.scrollTo({ top: 0, behavior: "instant" });
      });
      bar.appendChild(btn);
    });
  }

  function initApp(role, name, uid) {
    const tabs = TABS_BY_ROLE[role] || TABS_BY_ROLE.abteilung;

    document.getElementById("user-name-label").textContent = name || "";

    buildViews(tabs, role, uid);
    buildTabbar(tabs);

    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
  }

  // -----------------------------------------------------------------
  // Auth-Check: nicht eingeloggt -> zurück zum Login.
  // Rolle/Name kommen aus sessionStorage (von index.html gesetzt);
  // falls nicht vorhanden (z.B. Seite neu geöffnet), aus Firestore nachladen.
  // -----------------------------------------------------------------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    let role = sessionStorage.getItem("marmotte_role");
    let name = sessionStorage.getItem("marmotte_name");

    if (!role) {
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          await signOut(auth);
          window.location.href = "index.html";
          return;
        }
        const data = userDoc.data();
        if (data.active === false) {
          await signOut(auth);
          window.location.href = "index.html";
          return;
        }
        role = data.role || "abteilung";
        name = data.name || "";
        sessionStorage.setItem("marmotte_role", role);
        sessionStorage.setItem("marmotte_name", name);
      } catch (err) {
        console.error(err);
        window.location.href = "index.html";
        return;
      }
    }

    initApp(role, name, user.uid);
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    sessionStorage.removeItem("marmotte_role");
    sessionStorage.removeItem("marmotte_name");
    window.location.href = "index.html";
  });

  // Service Worker registrieren (falls noch nicht aktiv, z.B. Direktaufruf von app.html)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("Service Worker konnte nicht registriert werden:", err);
      });
    });
  }
</script>
