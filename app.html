<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmotte Bestellungen</title>
<meta name="theme-color" content="#1A1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marmotte">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon_bestellungen_favicon32.png">
<link rel="apple-touch-icon" href="assets/icon_bestellungen_appletouch180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .app-header .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 19px;
    color: var(--color-yellow);
    letter-spacing: -0.01em;
  }
  .app-header .brand small {
    display: block;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    color: var(--color-text-muted);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .user-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-meta { text-align: right; }
  .user-meta .name {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.2;
  }
  .user-meta .role {
    font-size: 11.5px;
    color: var(--color-text-muted);
    text-transform: capitalize;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .logout-btn:hover { color: var(--color-danger); border-color: rgba(229, 72, 77, 0.4); }

  /* ---------- Main content ---------- */
  main {
    flex: 1;
    padding: 20px 16px 96px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view-title {
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 16px;
  }
  .placeholder-card {
    padding: 28px 22px;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 14px;
  }
  .placeholder-card .stage-tag {
    display: inline-block;
    background: var(--color-surface-raised);
    color: var(--color-yellow);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  /* Sub-tabs (z.B. innerhalb "Bestellung erstellen") */
  .subtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .subtab-btn {
    flex: none;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .subtab-btn.active {
    background: var(--color-yellow);
    color: #1a1400;
    border-color: var(--color-yellow);
  }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--color-text-muted);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .tab-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: transparent;
  }
  .tab-btn.active { color: var(--color-yellow); }
  .tab-btn.active .dot { background: var(--color-yellow); }

  .loading-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--color-text-muted);
    font-size: 14px;
  }

  /* ---------- Verwaltung (Gruppen/Artikel) ---------- */
  .mgmt-section { margin-bottom: 28px; }
  .mgmt-section h3 {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-text-muted);
    margin: 0 0 12px;
  }
  .inline-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .inline-form input, .inline-form select {
    flex: 1;
    min-width: 140px;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
  }
  .inline-form input:focus, .inline-form select:focus { outline: none; border-color: var(--color-yellow); }
  .inline-form .btn { flex: none; padding: 11px 16px; font-size: 13.5px; }

  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--color-border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .row-name {
    flex: 1;
    font-size: 14px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .list-row .row-name input {
    width: 100%;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-yellow);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
  }
  .row-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { border-color: var(--color-yellow); color: var(--color-yellow); }
  .icon-btn.danger:hover { border-color: rgba(229, 72, 77, 0.5); color: var(--color-danger); }
  .toggle-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .toggle-btn.active {
    background: rgba(76, 175, 125, 0.15);
    border-color: var(--color-success);
    color: var(--color-success);
  }
  .group-header {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-yellow);
    padding: 12px 14px 6px;
  }
  .group-header:first-child { padding-top: 4px; }

  .menge-input {
    width: 64px;
    text-align: center;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 8px 6px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-body);
    flex: none;
  }
  .menge-input:focus { outline: none; border-color: var(--color-yellow); }

  .static-value {
    padding: 12px 14px;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 15px;
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">Wird geladen …</div>

<div id="app-shell" style="display:none;">
  <header class="app-header">
    <div class="brand">Marmotte<small>Bestellungen</small></div>
    <div class="user-box">
      <div class="user-meta">
        <div class="name" id="user-name">–</div>
        <div class="role" id="user-role">–</div>
      </div>
      <button type="button" class="logout-btn" id="logout-btn">Abmelden</button>
    </div>
  </header>

  <main id="main-content">
    <!-- Views werden per JS eingefügt, je nach Rolle -->
  </main>

  <nav class="tabbar" id="tabbar">
    <!-- Tabs werden per JS eingefügt, je nach Rolle -->
  </nav>
</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, getDocs, setDoc, collection, addDoc, updateDoc, deleteDoc,
    onSnapshot, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---------------------------------------------------------------------
  // Tab-Konfiguration je Rolle.
  // Jeder Tab hat eine id (= View-id) und ein Label.
  // "erstellen" (admin/leitung) hat zusätzlich Sub-Tabs zur Typ-Auswahl.
  // ---------------------------------------------------------------------
  const TABS_BY_ROLE = {
    admin: [
      { id: "bestellungen", label: "Bestellungen" },
      { id: "erstellen", label: "Bestellung erstellen" },
      { id: "einstellungen", label: "Einstellungen" },
    ],
    leitung: [
      { id: "bestellungen", label: "Bestellungen" },
      { id: "erstellen", label: "Bestellung erstellen" },
      { id: "einstellungen", label: "Einstellungen" },
    ],
    abteilung: [
      { id: "bestellungen", label: "Bestellungen" },
      { id: "neu-abteilung", label: "Abteilung" },
      { id: "neu-kunde", label: "Kunde" },
      { id: "neu-hotel", label: "Hotel/Rest." },
    ],
    hotelrestaurant: [
      { id: "bestellungen", label: "Bestellungen" },
      { id: "neu", label: "Neue Bestellung" },
    ],
  };

  const ROLE_LABELS = {
    admin: "Admin",
    leitung: "Leitung",
    abteilung: "Abteilung",
    hotelrestaurant: "Hotel / Restaurant",
  };

  // Placeholder-Inhalt je View-id. Wird in späteren Schichten durch
  // echte Formulare/Listen ersetzt.
  const VIEW_PLACEHOLDERS = {
    "bestellungen": "Übersicht aller Bestellungen – wird in Schicht 2 gebaut.",
    "erstellen": null, // hat Sub-Tabs, siehe renderErstellenView
    "einstellungen": null, // hat Sub-Tabs, siehe renderEinstellungenView
    "neu-abteilung": "Formular Abteilungsbestellung – wird in Schicht 2 gebaut.",
    "neu-kunde": "Formular Kundenbestellung – wird in Schicht 2 gebaut.",
    "neu-hotel": "Formular Hotel/Restaurant-Bestellung – wird in Schicht 2 gebaut.",
    "neu": "Formular Neue Bestellung – wird in Schicht 2 gebaut.",
  };

  const ERSTELLEN_SUBTABS = [
    { id: "abteilung", label: "Abteilungsbestellung" },
    { id: "kunde", label: "Kundenbestellung" },
    { id: "hotel", label: "Hotel/Restaurant" },
  ];

  const EINSTELLUNGEN_SUBTABS = [
    { id: "artikel-abteilung", label: "Artikel Abteilung/Kunde" },
    { id: "artikel-hotel", label: "Artikel Hotel/Restaurant" },
    { id: "bestellschluss", label: "Bestellschluss-Zeiten" },
  ];

  function placeholderCard(text) {
    return `
      <div class="card placeholder-card">
        <span class="stage-tag">Schicht 1 – Shell</span>
        <p>${text}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function nextSortValue(list) {
    if (!list.length) return 0;
    return Math.max(...list.map((item) => item.sortierung || 0)) + 1;
  }

  // -----------------------------------------------------------------
  // Zeit-Konvertierung Schweizer Lokalzeit <-> UTC-Minuten seit Mitternacht.
  // Bestellschluss-Zeiten werden als UTC-Minuten gespeichert (Security Rules
  // kennen nur UTC-Serverzeit). Die Umrechnung erfolgt anhand des heutigen
  // Datums, damit die Sommer-/Winterzeit korrekt berücksichtigt wird.
  // Randfall: an den 2 Zeitumstellungstagen im Jahr kann es zu einer
  // 1h-Verschiebung kommen, falls die Einstellung nicht am selben Tag neu
  // gespeichert wird.
  // -----------------------------------------------------------------
  function utcMinutesToZurichTimeString(minutes) {
    const now = new Date();
    const utcDate = new Date(Date.UTC(
      now.getFullYear(), now.getMonth(), now.getDate(),
      Math.floor(minutes / 60), minutes % 60
    ));
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Zurich", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).format(utcDate);
  }

  function zurichLocalToUtcMinutes(hh, mm) {
    const now = new Date();
    const guessUtc = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm));
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Zurich",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(guessUtc).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
    const zurichWallAsUtcMillis = Date.UTC(
      Number(parts.year), Number(parts.month) - 1, Number(parts.day),
      Number(parts.hour), Number(parts.minute)
    );
    const offsetMinutes = Math.round((zurichWallAsUtcMillis - guessUtc.getTime()) / 60000);
    const actualUtc = new Date(guessUtc.getTime() - offsetMinutes * 60000);
    return actualUtc.getUTCHours() * 60 + actualUtc.getUTCMinutes();
  }

  // -----------------------------------------------------------------
  // Einstellungen > Bestellschluss-Zeiten
  // Ein Dokument einstellungen/bestellschluss mit Feldern
  // abteilung / kunde / hotel (jeweils UTC-Minuten seit Mitternacht).
  // -----------------------------------------------------------------
  async function initBestellschlussPanel(panel) {
    panel.innerHTML = `
      <div class="mgmt-section">
        <h3>Bestellschluss-Zeiten</h3>
        <p class="hint-text" style="margin:-4px 0 18px;">
          Schweizer Lokalzeit, gilt täglich gleich, bis hier geändert. Nach Bestellschluss
          bleiben Bestellungen sichtbar, sind aber nicht mehr bearbeitbar.
        </p>
        <form id="bestellschluss-form">
          <div class="field">
            <label for="bs-abteilung">Abteilung</label>
            <input type="time" id="bs-abteilung" required>
          </div>
          <div class="field">
            <label for="bs-kunde">Kunde</label>
            <input type="time" id="bs-kunde" required>
          </div>
          <div class="field">
            <label for="bs-hotel">Hotel/Restaurant</label>
            <input type="time" id="bs-hotel" required>
          </div>
          <div class="error-text" id="bs-error"></div>
          <div id="bs-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="bs-save-btn" style="width:100%;">Speichern</button>
        </form>
      </div>
    `;

    const form = panel.querySelector("#bestellschluss-form");
    const errorEl = panel.querySelector("#bs-error");
    const successEl = panel.querySelector("#bs-success");
    const saveBtn = panel.querySelector("#bs-save-btn");
    const TYPES = ["abteilung", "kunde", "hotel"];

    try {
      const snap = await getDoc(doc(db, "einstellungen", "bestellschluss"));
      if (snap.exists()) {
        const data = snap.data();
        TYPES.forEach((typ) => {
          if (typeof data[typ] === "number") {
            panel.querySelector(`#bs-${typ}`).value = utcMinutesToZurichTimeString(data[typ]);
          }
        });
      }
    } catch (err) {
      console.error(err);
      errorEl.textContent = "Bestehende Zeiten konnten nicht geladen werden.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";
      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        const payload = {};
        TYPES.forEach((typ) => {
          const value = panel.querySelector(`#bs-${typ}`).value;
          const [hh, mm] = value.split(":").map(Number);
          payload[typ] = zurichLocalToUtcMinutes(hh, mm);
        });
        await setDoc(doc(db, "einstellungen", "bestellschluss"), payload, { merge: true });
        successEl.textContent = "Gespeichert.";
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Speichern";
      }
    });
  }

  // -----------------------------------------------------------------
  // Einstellungen > Artikel Abteilung/Kunde
  // Verwaltet zwei Collections: artikel_gruppen (name, sortierung)
  // und artikel_abteilung (name, aktiv, gruppe, sortierung).
  // -----------------------------------------------------------------
  function initArtikelAbteilungPanel(panel) {
    panel.innerHTML = `
      <div class="mgmt-section">
        <h3>Gruppen</h3>
        <form class="inline-form" id="gruppe-form">
          <input type="text" id="gruppe-name-input" placeholder="Neue Gruppe…" required>
          <button type="submit" class="btn btn-secondary">Hinzufügen</button>
        </form>
        <div class="card" id="gruppen-list"></div>
      </div>
      <div class="mgmt-section">
        <h3>Artikel</h3>
        <form class="inline-form" id="artikel-form">
          <input type="text" id="artikel-name-input" placeholder="Artikelname…" required>
          <select id="artikel-gruppe-select" required></select>
          <button type="submit" class="btn btn-secondary">Hinzufügen</button>
        </form>
        <div class="card" id="artikel-list"></div>
      </div>
    `;

    let gruppen = [];
    let artikel = [];

    const gruppenListEl = panel.querySelector("#gruppen-list");
    const artikelListEl = panel.querySelector("#artikel-list");
    const gruppeSelect = panel.querySelector("#artikel-gruppe-select");

    function renderGruppen() {
      if (!gruppen.length) {
        gruppenListEl.innerHTML = `<div class="list-row"><span class="hint-text">Noch keine Gruppen angelegt.</span></div>`;
      } else {
        gruppenListEl.innerHTML = gruppen
          .map(
            (g) => `
          <div class="list-row" data-id="${g.id}">
            <span class="row-name" data-role="display">${escapeHtml(g.name)}</span>
            <div class="row-actions">
              <button type="button" class="icon-btn" data-action="edit" title="Umbenennen">✎</button>
              <button type="button" class="icon-btn danger" data-action="delete" title="Löschen">🗑</button>
            </div>
          </div>`
          )
          .join("");
      }
      gruppeSelect.innerHTML = gruppen
        .map((g) => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`)
        .join("");
    }

    function renderArtikel() {
      if (!artikel.length) {
        artikelListEl.innerHTML = `<div class="list-row"><span class="hint-text">Noch keine Artikel angelegt.</span></div>`;
        return;
      }
      const byGroup = {};
      artikel.forEach((a) => {
        const g = a.gruppe || "Ohne Gruppe";
        (byGroup[g] = byGroup[g] || []).push(a);
      });
      const knownOrder = gruppen.map((g) => g.name);
      const extraGroups = Object.keys(byGroup).filter((g) => !knownOrder.includes(g));
      const groupOrder = [...knownOrder, ...extraGroups].filter((g) => byGroup[g]);

      artikelListEl.innerHTML = groupOrder
        .map((g) => {
          const rows = byGroup[g]
            .slice()
            .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0))
            .map(
              (a) => `
            <div class="list-row" data-id="${a.id}">
              <span class="row-name" data-role="display">${escapeHtml(a.name)}</span>
              <div class="row-actions">
                <button type="button" class="toggle-btn ${a.aktiv ? "active" : ""}" data-action="toggle">${a.aktiv ? "Aktiv" : "Inaktiv"}</button>
                <button type="button" class="icon-btn" data-action="edit" title="Umbenennen">✎</button>
                <button type="button" class="icon-btn danger" data-action="delete" title="Löschen">🗑</button>
              </div>
            </div>`
            )
            .join("");
          return `<div class="group-header">${escapeHtml(g)}</div>${rows}`;
        })
        .join("");
    }

    onSnapshot(collection(db, "artikel_gruppen"), (snap) => {
      gruppen = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0));
      renderGruppen();
      renderArtikel();
    });

    onSnapshot(collection(db, "artikel_abteilung"), (snap) => {
      artikel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderArtikel();
    });

    panel.querySelector("#gruppe-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = panel.querySelector("#gruppe-name-input");
      const name = input.value.trim();
      if (!name) return;
      await addDoc(collection(db, "artikel_gruppen"), {
        name,
        sortierung: nextSortValue(gruppen),
      });
      input.value = "";
    });

    panel.querySelector("#artikel-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameInput = panel.querySelector("#artikel-name-input");
      const name = nameInput.value.trim();
      const gruppe = gruppeSelect.value;
      if (!name || !gruppe) return;
      const sortierung = nextSortValue(artikel.filter((a) => a.gruppe === gruppe));
      await addDoc(collection(db, "artikel_abteilung"), {
        name,
        aktiv: true,
        gruppe,
        sortierung,
      });
      nameInput.value = "";
    });

    gruppenListEl.addEventListener("click", (e) => handleRowAction(e, "artikel_gruppen", gruppen));
    artikelListEl.addEventListener("click", (e) => handleRowAction(e, "artikel_abteilung", artikel));

    async function handleRowAction(e, collectionName, sourceList) {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const row = e.target.closest(".list-row");
      const id = row?.dataset.id;
      if (!id) return;
      const action = actionBtn.dataset.action;
      const item = sourceList.find((i) => i.id === id);

      if (action === "delete") {
        const label = collectionName === "artikel_gruppen" ? "diese Gruppe" : "diesen Artikel";
        if (!confirm(`Soll ${label} wirklich gelöscht werden?`)) return;
        await deleteDoc(doc(db, collectionName, id));
      } else if (action === "toggle") {
        await updateDoc(doc(db, collectionName, id), { aktiv: !item.aktiv });
      } else if (action === "edit") {
        const nameEl = row.querySelector('[data-role="display"]');
        const currentName = item ? item.name : nameEl.textContent;
        nameEl.innerHTML = `<input type="text" value="${escapeHtml(currentName)}">`;
        const editInput = nameEl.querySelector("input");
        editInput.focus();
        editInput.select();

        const commit = async () => {
          const newName = editInput.value.trim();
          if (newName && newName !== currentName) {
            await updateDoc(doc(db, collectionName, id), { name: newName });
          } else {
            nameEl.textContent = currentName;
          }
        };
        editInput.addEventListener("blur", commit);
        editInput.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") editInput.blur();
          if (ev.key === "Escape") { nameEl.textContent = currentName; }
        });
      }
    }
  }

  // -----------------------------------------------------------------
  // Einstellungen > Artikel Hotel/Restaurant
  // Eigene, ungruppierte Collection artikel_hotel (name, aktiv),
  // alphabetisch sortiert.
  // -----------------------------------------------------------------
  function initArtikelHotelPanel(panel) {
    panel.innerHTML = `
      <div class="mgmt-section">
        <h3>Artikel Hotel/Restaurant</h3>
        <form class="inline-form" id="hotel-artikel-form">
          <input type="text" id="hotel-artikel-name-input" placeholder="Artikelname…" required>
          <button type="submit" class="btn btn-secondary">Hinzufügen</button>
        </form>
        <div class="card" id="hotel-artikel-list"></div>
      </div>
    `;

    let artikel = [];
    const listEl = panel.querySelector("#hotel-artikel-list");

    function render() {
      if (!artikel.length) {
        listEl.innerHTML = `<div class="list-row"><span class="hint-text">Noch keine Artikel angelegt.</span></div>`;
        return;
      }
      const sorted = artikel.slice().sort((a, b) => a.name.localeCompare(b.name, "de"));
      listEl.innerHTML = sorted
        .map(
          (a) => `
        <div class="list-row" data-id="${a.id}">
          <span class="row-name" data-role="display">${escapeHtml(a.name)}</span>
          <div class="row-actions">
            <button type="button" class="toggle-btn ${a.aktiv ? "active" : ""}" data-action="toggle">${a.aktiv ? "Aktiv" : "Inaktiv"}</button>
            <button type="button" class="icon-btn" data-action="edit" title="Umbenennen">✎</button>
            <button type="button" class="icon-btn danger" data-action="delete" title="Löschen">🗑</button>
          </div>
        </div>`
        )
        .join("");
    }

    onSnapshot(collection(db, "artikel_hotel"), (snap) => {
      artikel = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    });

    panel.querySelector("#hotel-artikel-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = panel.querySelector("#hotel-artikel-name-input");
      const name = input.value.trim();
      if (!name) return;
      await addDoc(collection(db, "artikel_hotel"), { name, aktiv: true });
      input.value = "";
    });

    listEl.addEventListener("click", async (e) => {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const row = e.target.closest(".list-row");
      const id = row?.dataset.id;
      if (!id) return;
      const action = actionBtn.dataset.action;
      const item = artikel.find((i) => i.id === id);

      if (action === "delete") {
        if (!confirm("Soll dieser Artikel wirklich gelöscht werden?")) return;
        await deleteDoc(doc(db, "artikel_hotel", id));
      } else if (action === "toggle") {
        await updateDoc(doc(db, "artikel_hotel", id), { aktiv: !item.aktiv });
      } else if (action === "edit") {
        const nameEl = row.querySelector('[data-role="display"]');
        const currentName = item ? item.name : nameEl.textContent;
        nameEl.innerHTML = `<input type="text" value="${escapeHtml(currentName)}">`;
        const editInput = nameEl.querySelector("input");
        editInput.focus();
        editInput.select();

        const commit = async () => {
          const newName = editInput.value.trim();
          if (newName && newName !== currentName) {
            await updateDoc(doc(db, "artikel_hotel", id), { name: newName });
          } else {
            nameEl.textContent = currentName;
          }
        };
        editInput.addEventListener("blur", commit);
        editInput.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") editInput.blur();
          if (ev.key === "Escape") { nameEl.textContent = currentName; }
        });
      }
    });
  }

  // -----------------------------------------------------------------
  // Datums-Helfer: Abteilungsbestellungen sind immer "heute auf morgen".
  // -----------------------------------------------------------------
  function tomorrowDateString() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDateDe(isoDateStr) {
    const [y, m, d] = isoDateStr.split("-");
    return `${d}.${m}.${y}`;
  }

  // -----------------------------------------------------------------
  // Abteilungsbestellung erstellen.
  // Wird sowohl von Rolle 'abteilung' (eigene Abteilung fix) als auch von
  // admin/leitung (Abteilung per Dropdown wählbar) verwendet.
  // -----------------------------------------------------------------
  async function initAbteilungsbestellungForm(container, { role, uid }) {
    container.innerHTML = `<div class="card placeholder-card"><p>Formular wird geladen …</p></div>`;

    let bestellschlussErreicht = false;
    try {
      const bsSnap = await getDoc(doc(db, "einstellungen", "bestellschluss"));
      if (bsSnap.exists() && typeof bsSnap.data().abteilung === "number") {
        const now = new Date();
        const nowUtcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
        bestellschlussErreicht = nowUtcMinutes >= bsSnap.data().abteilung;
      }
    } catch (err) {
      console.error(err);
    }

    let ownAbteilung = null;
    if (role === "abteilung") {
      try {
        const userSnap = await getDoc(doc(db, "users", uid));
        ownAbteilung = userSnap.exists() ? userSnap.data().abteilung : null;
      } catch (err) {
        console.error(err);
      }
    }

    let artikelListRaw = [];
    let gruppen = [];
    try {
      const [artikelSnap, gruppenSnap] = await Promise.all([
        getDocs(collection(db, "artikel_abteilung")),
        getDocs(collection(db, "artikel_gruppen")),
      ]);
      artikelListRaw = artikelSnap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => a.aktiv);
      gruppen = gruppenSnap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0));
    } catch (err) {
      console.error(err);
    }

    const byGroup = {};
    artikelListRaw.forEach((a) => {
      const g = a.gruppe || "Ohne Gruppe";
      (byGroup[g] = byGroup[g] || []).push(a);
    });
    const knownOrder = gruppen.map((g) => g.name);
    const extraGroups = Object.keys(byGroup).filter((g) => !knownOrder.includes(g));
    const groupOrder = [...knownOrder, ...extraGroups].filter((g) => byGroup[g]);

    const artikelHtml = artikelListRaw.length === 0
      ? `<p class="hint-text">Keine aktiven Artikel vorhanden. Bitte zuerst in den Einstellungen Artikel anlegen.</p>`
      : groupOrder
          .map((g) => {
            const rows = byGroup[g]
              .slice()
              .sort((a, b) => (a.sortierung || 0) - (b.sortierung || 0))
              .map(
                (a) => `
              <div class="list-row">
                <span class="row-name">${escapeHtml(a.name)}</span>
                <input type="number" min="0" step="1" placeholder="0" class="menge-input"
                       data-artikel-id="${a.id}" data-artikel-name="${escapeHtml(a.name)}">
              </div>`
              )
              .join("");
            return `<div class="group-header">${escapeHtml(g)}</div>${rows}`;
          })
          .join("");

    container.innerHTML = `
      <div class="card" style="padding:20px;">
        ${bestellschlussErreicht ? `<div class="error-text" style="margin-bottom:14px;">Bestellschluss für heute erreicht – es kann aktuell keine Abteilungsbestellung mehr erstellt werden.</div>` : ""}
        <form id="af-form">
          <div class="field">
            <label>Lieferung</label>
            <div class="static-value">Morgen, ${formatDateDe(tomorrowDateString())}</div>
          </div>
          ${
            role === "abteilung"
              ? `<div class="field">
                  <label>Abteilung</label>
                  <div class="static-value">${ownAbteilung === "dorfladen" ? "Dorfladen" : "Tearoom & Laden"}</div>
                </div>`
              : `<div class="field">
                  <label for="af-abteilung-select">Abteilung</label>
                  <select id="af-abteilung-select" required>
                    <option value="tearoom_laden">Tearoom &amp; Laden</option>
                    <option value="dorfladen">Dorfladen</option>
                  </select>
                </div>`
          }
          <div class="field">
            <label>Artikel</label>
            <div class="card" id="af-artikel-liste">${artikelHtml}</div>
          </div>
          <div class="error-text" id="af-error"></div>
          <div id="af-success" style="color:var(--color-success);font-size:13.5px;margin:-10px 0 14px;min-height:18px;"></div>
          <button type="submit" class="btn btn-primary" id="af-save-btn" style="width:100%;" ${bestellschlussErreicht ? "disabled" : ""}>
            Bestellung speichern
          </button>
        </form>
      </div>
    `;

    const form = container.querySelector("#af-form");
    const errorEl = container.querySelector("#af-error");
    const successEl = container.querySelector("#af-success");
    const saveBtn = container.querySelector("#af-save-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";

      const abteilungValue = role === "abteilung"
        ? ownAbteilung
        : container.querySelector("#af-abteilung-select").value;

      if (!abteilungValue) {
        errorEl.textContent = "Abteilung konnte nicht ermittelt werden.";
        return;
      }

      const items = [];
      container.querySelectorAll(".menge-input").forEach((inp) => {
        const menge = parseInt(inp.value, 10);
        if (menge > 0) {
          items.push({ artikelId: inp.dataset.artikelId, artikelName: inp.dataset.artikelName, menge });
        }
      });

      if (items.length === 0) {
        errorEl.textContent = "Bitte mindestens einen Artikel mit Menge grösser 0 angeben.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Speichert …";

      try {
        await addDoc(collection(db, "bestellungen_abteilung"), {
          abteilung: abteilungValue,
          liefertag: tomorrowDateString(),
          items,
          status: "offen",
          erstelltVon: uid,
          erstelltAm: serverTimestamp(),
        });
        successEl.textContent = "Bestellung gespeichert.";
        container.querySelectorAll(".menge-input").forEach((inp) => { inp.value = ""; });
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Fehler beim Speichern. Bitte erneut versuchen.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Bestellung speichern";
      }
    });
  }

  function renderSubtabView(containerId, subtabs, contentPrefix, customRenderers = {}) {
    const container = document.getElementById(containerId);
    const nav = document.createElement("div");
    nav.className = "subtabs";
    subtabs.forEach((st, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "subtab-btn" + (i === 0 ? " active" : "");
      btn.textContent = st.label;
      btn.dataset.subtab = st.id;
      btn.addEventListener("click", () => {
        nav.querySelectorAll(".subtab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        container.querySelectorAll(".subtab-panel").forEach((p) => p.style.display = "none");
        document.getElementById(`${contentPrefix}-${st.id}`).style.display = "block";
      });
      nav.appendChild(btn);
    });
    container.appendChild(nav);

    subtabs.forEach((st, i) => {
      const panel = document.createElement("div");
      panel.className = "subtab-panel";
      panel.id = `${contentPrefix}-${st.id}`;
      panel.style.display = i === 0 ? "block" : "none";
      if (customRenderers[st.id]) {
        customRenderers[st.id](panel);
      } else {
        panel.innerHTML = placeholderCard(`${st.label} – wird in Schicht 2 gebaut.`);
      }
      container.appendChild(panel);
    });
  }

  function buildViews(tabs, role, uid) {
    const main = document.getElementById("main-content");
    main.innerHTML = "";

    tabs.forEach((tab, i) => {
      const view = document.createElement("section");
      view.className = "view" + (i === 0 ? " active" : "");
      view.id = `view-${tab.id}`;

      const title = document.createElement("div");
      title.className = "view-title";
      title.textContent = tab.label;
      view.appendChild(title);

      if (tab.id === "erstellen") {
        main.appendChild(view);
        renderSubtabView(`view-${tab.id}`, ERSTELLEN_SUBTABS, "erstellen", {
          "abteilung": (panel) => initAbteilungsbestellungForm(panel, { role, uid }),
        });
      } else if (tab.id === "einstellungen") {
        main.appendChild(view);
        renderSubtabView(`view-${tab.id}`, EINSTELLUNGEN_SUBTABS, "einstellungen", {
          "artikel-abteilung": initArtikelAbteilungPanel,
          "artikel-hotel": initArtikelHotelPanel,
          "bestellschluss": initBestellschlussPanel,
        });
      } else if (tab.id === "neu-abteilung") {
        const body = document.createElement("div");
        view.appendChild(body);
        main.appendChild(view);
        initAbteilungsbestellungForm(body, { role, uid });
      } else {
        const body = document.createElement("div");
        body.innerHTML = placeholderCard(VIEW_PLACEHOLDERS[tab.id] || "Kommt in einer späteren Schicht.");
        view.appendChild(body);
        main.appendChild(view);
      }
    });
  }

  function buildTabbar(tabs) {
    const bar = document.getElementById("tabbar");
    bar.innerHTML = "";
    tabs.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (i === 0 ? " active" : "");
      btn.dataset.tab = tab.id;
      btn.innerHTML = `<span class="dot"></span><span>${tab.label}</span>`;
      btn.addEventListener("click", () => {
        bar.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
        document.getElementById(`view-${tab.id}`).classList.add("active");
        window.scrollTo({ top: 0, behavior: "instant" });
      });
      bar.appendChild(btn);
    });
  }

  function initApp(role, name, uid) {
    const tabs = TABS_BY_ROLE[role] || TABS_BY_ROLE.abteilung;

    document.getElementById("user-name").textContent = name || "–";
    document.getElementById("user-role").textContent = ROLE_LABELS[role] || role;

    buildViews(tabs, role, uid);
    buildTabbar(tabs);

    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
  }

  // -----------------------------------------------------------------
  // Auth-Check: nicht eingeloggt -> zurück zum Login.
  // Rolle/Name kommen aus sessionStorage (von index.html gesetzt);
  // falls nicht vorhanden (z.B. Seite neu geöffnet), aus Firestore nachladen.
  // -----------------------------------------------------------------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    let role = sessionStorage.getItem("marmotte_role");
    let name = sessionStorage.getItem("marmotte_name");

    if (!role) {
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          await signOut(auth);
          window.location.href = "index.html";
          return;
        }
        const data = userDoc.data();
        if (data.active === false) {
          await signOut(auth);
          window.location.href = "index.html";
          return;
        }
        role = data.role || "abteilung";
        name = data.name || "";
        sessionStorage.setItem("marmotte_role", role);
        sessionStorage.setItem("marmotte_name", name);
      } catch (err) {
        console.error(err);
        window.location.href = "index.html";
        return;
      }
    }

    initApp(role, name, user.uid);
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    sessionStorage.removeItem("marmotte_role");
    sessionStorage.removeItem("marmotte_name");
    window.location.href = "index.html";
  });

  // Service Worker registrieren (falls noch nicht aktiv, z.B. Direktaufruf von app.html)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("Service Worker konnte nicht registriert werden:", err);
      });
    });
  }
</script>
